<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="939" height="469" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">ROCmKernelWiki — three-layer knowledge base</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#57606a">AMD CDNA3 (gfx942) · CDNA4 (gfx950 / MI350) · RDNA4 (gfx1201) — packaged as a Claude Code skill</text>

  <!-- Layer 1: sources -->
  <rect x="40" y="92" width="250" height="150" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="40" y="92" width="250" height="34" rx="10" fill="#2563eb"/>
  <text x="165" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">sources/</text>
  <text x="165" y="150" text-anchor="middle" font-size="12.5" fill="#1f2328">raw, immutable summaries</text>
  <text x="165" y="172" text-anchor="middle" font-size="12" fill="#57606a">prs/ — 7,400+ merged PRs</text>
  <text x="165" y="190" text-anchor="middle" font-size="12" fill="#57606a">docs/ · blogs/ · refs/</text>
  <text x="165" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">cross-referenced by id</text>

  <!-- Layer 2: wiki -->
  <rect x="345" y="92" width="250" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="345" y="92" width="250" height="34" rx="10" fill="#7c3aed"/>
  <text x="470" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">wiki/</text>
  <text x="470" y="150" text-anchor="middle" font-size="12.5" fill="#1f2328">synthesized pages + frontmatter</text>
  <text x="470" y="172" text-anchor="middle" font-size="12" fill="#57606a">hardware · techniques · kernels</text>
  <text x="470" y="190" text-anchor="middle" font-size="12" fill="#57606a">patterns · languages · migration</text>
  <text x="470" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">performance_claims · evidence_basis</text>

  <!-- Layer 3: queries -->
  <rect x="650" y="92" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <rect x="650" y="92" width="250" height="34" rx="10" fill="#059669"/>
  <text x="775" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">queries/</text>
  <text x="775" y="150" text-anchor="middle" font-size="12.5" fill="#1f2328">auto-generated indices</text>
  <text x="775" y="172" text-anchor="middle" font-size="12" fill="#57606a">by-problem · by-technique</text>
  <text x="775" y="190" text-anchor="middle" font-size="12" fill="#57606a">by-hardware · by-kernel · by-repo</text>
  <text x="775" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">never hand-edited</text>

  <!-- flow arrows -->
  <line x1="292" y1="167" x2="343" y2="167" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="317" y="158" text-anchor="middle" font-size="10.5" fill="#57606a">synthesize</text>
  <line x1="597" y1="167" x2="648" y2="167" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="622" y="158" text-anchor="middle" font-size="10.5" fill="#57606a">generate</text>

  <!-- supporting: data + scripts -->
  <rect x="40" y="300" width="410" height="120" rx="10" fill="#fafbfc" stroke="#d0d7de"/>
  <text x="60" y="324" font-size="14" font-weight="700" fill="#1f2328">data/ — controlled vocabulary &amp; schema</text>
  <text x="60" y="348" font-size="12" fill="#57606a">schemas.yaml · tags.yaml · aliases.yaml</text>
  <text x="60" y="368" font-size="12" fill="#57606a">inclusion-policy · tool-versions · refresh-cutoff</text>
  <text x="60" y="396" font-size="11.5" fill="#57606a">hardware-verified.yaml ← MI350X silicon checks</text>

  <rect x="490" y="300" width="410" height="120" rx="10" fill="#fafbfc" stroke="#d0d7de"/>
  <text x="510" y="324" font-size="14" font-weight="700" fill="#1f2328">scripts/ — tooling &amp; CI gate</text>
  <text x="510" y="348" font-size="12" fill="#57606a">query.py · get_page.py · grep_wiki.py</text>
  <text x="510" y="368" font-size="12" fill="#57606a">validate.py (schema · vocab · links)</text>
  <text x="510" y="388" font-size="12" fill="#57606a">generate-indices.py · harvest_prs.py</text>

  <!-- gate arrows -->
  <line x1="245" y1="300" x2="320" y2="244" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="232" y="292" font-size="10.5" fill="#8c959f">validates →</text>
  <line x1="695" y1="300" x2="760" y2="244" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="292" font-size="10.5" fill="#8c959f">regenerates →</text>

  <!-- skill pill -->
  <rect x="704" y="438" width="196" height="22" rx="11" fill="#1f2328"/>
  <text x="802" y="453" text-anchor="middle" font-size="11.5" fill="#ffffff">SKILL.md @ root → Claude Code skill</text>
</svg>
