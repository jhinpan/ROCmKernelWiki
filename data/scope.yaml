# Single source of truth for the actively supported architecture scope.
# Raw sources for other architectures remain in the repository for future
# recovery, but default queries, generated indices, and synthesis claims only
# expose the active scope.

in_scope_architectures:
  - gfx942
  - gfx950

quarantined_architectures:
  - gfx90a
  - gfx1100
  - gfx1201
  - gfx1250

quarantined_pages:
  - hw-wmma
  - lang-rocwmma
  - migration-wmma-vs-mfma
  # MI450 / gfx1250 synthesis: retained as forward-looking research. These pages
  # are source-reported from a vendor blog on pre-release hardware and are not
  # silicon-verified, so they stay out of default retrieval until gfx1250 becomes
  # an actively supported target.
  - hw-mi450-tdm
  - hw-mi450-workgroup-cluster
  - technique-tdm-tile-widening
  - technique-attention-decode-pipelining
  - kernel-gluon-attention-decode-mi450

quarantined_query_terms:
  - wmma
  - wave32
  - rdna
