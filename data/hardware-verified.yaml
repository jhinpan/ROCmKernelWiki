## Hardware-verification registry.
##
## Records claims that were checked by COMPILING / RUNNING / DISASSEMBLING real
## code on actual silicon (not just traced to a doc). Companion to
## version-claims.yaml. The full narrative + raw evidence excerpts live in
## ../VERIFICATION.md.
##
## Schema per entry:
##   id:          stable identifier
##   claim:       the statement that was tested
##   verdict:     confirmed | refuted | refined | source-reported
##   method:      how it was checked on-hardware
##   pages:       wiki pages whose text this supports/corrects

gpu:
  marketing: "AMD Instinct MI350X"
  gfx: "gfx950:sramecc+:xnack-"
  arch: "CDNA4"
  verified_on: "2026-06-01"
  stack: {rocm: "7.2.0", hip: "7.2.26015", clang: "22.0.0git (roc-7.2.0)"}
  note: "Wiki content is pinned to ROCm 7.0.2 (data/tool-versions.yaml); these checks ran on the newer 7.2.0, so confirmations are strictly stronger. Double-checked by an independent adversarial re-run of every finding."

findings:
  - id: hv-specs
    claim: "256 CU, 32 shader engines, 4 SIMD/CU, wave64, L1 32KB, L2 4MB, MALL 256MB, 288GiB HBM3E, 2200MHz, 32 waves/CU; 8 XCDs x 32 active CU."
    verdict: confirmed
    method: "rocminfo + hipGetDeviceProperties + amd-smi partition"
    pages: [hw-chiplet-xcd, hw-wavefront]

  - id: hv-lds-160k
    claim: "gfx950 LDS is 160 KB/CU and is usable (a ~100KB dynamic extern __shared__ kernel launches and runs; would fail on gfx942's 64KB)."
    verdict: confirmed
    method: "sharedMemPerBlock=160KB; dynamic-LDS launch on-device"
    pages: [hw-lds, migration-gfx942-to-gfx950]

  - id: hv-fp8-ocp-vs-fnuz
    claim: "OCP FP8 (gfx950) and FNUZ FP8 (gfx942) are not bit-compatible: OCP-E4M3 max=448 vs FNUZ-E4M3 max=240; same byte decodes to different reals."
    verdict: confirmed
    method: "on-device encode/decode under both interpretations via hip_fp8.h"
    pages: [migration-gfx942-to-gfx950, kernel-fp8-gemm]

  - id: hv-f8f6f4-mfma
    claim: "Scaled f8f6f4 MFMA (MX/E8M0 block scaling) exists on gfx950, absent on gfx942."
    verdict: confirmed
    method: "__builtin_amdgcn_mfma_scale_f32_{16x16x128,32x32x64}_f8f6f4 compiles + emits v_mfma_scale_f32_*_f8f6f4 on gfx950; errors on gfx942; scaled kernel runs"
    pages: [hw-mfma, hw-mxfp, migration-gfx942-to-gfx950]
    note: "Clang exposes only the SCALED builtin; the unscaled v_mfma_f32_*_f8f6f4 is a real ISA mnemonic reachable via asm or ABID[0]=0."

  - id: hv-tf32-dropped
    claim: "Native TF32/XF32 matrix path is dropped on gfx950."
    verdict: confirmed
    method: "mfma_f32_16x16x8_xf32 / 32x32x4 compile for gfx942 but fail for gfx950 with backend 'Cannot select: intrinsic llvm.amdgcn.mfma.f32.16x16x8.xf32'"
    pages: [hw-mxfp, migration-gfx942-to-gfx950]
    note: "Sharper than 'emulated via BF16' — the native intrinsic does not lower."

  - id: hv-direct-lds-width
    claim: "Direct-to-LDS async copy is <=4B (one dword) on gfx942 and widens to 12/16B on gfx950."
    verdict: refined
    method: "__builtin_amdgcn_load_to_lds legal byte sizes {1,2,4} gfx942 vs {1,2,4,12,16} gfx950; emits global_load_lds_dword{,x3,x4}"
    pages: [hw-async-copy-lds, migration-gfx942-to-gfx950]
    note: "Corrected the migration page's '<=8B / dwordx2' to <=4B; no 8B/dwordx2 form exists on either generation."

  - id: hv-permlane16-swap
    claim: "gfx950 cross-lane is v_permlane16_swap_b32 (__builtin_amdgcn_permlane16_swap), NOT the RDNA selector-form permlanex16."
    verdict: refuted
    method: "permlanex16 builtin fails on gfx950 ('needs target feature gfx10-insts'); permlane16_swap compiles+emits on gfx950, errors on gfx942"
    pages: [hw-cross-lane, migration-gfx942-to-gfx950]
    note: "Corrected the code examples on both pages."

  - id: hv-waves-per-cu
    claim: "Per-CU hardware wave ceiling is 32 (4 SIMD x 8 slots), not 40 (4x10)."
    verdict: refuted
    method: "rocminfo 'Max Waves Per CU: 32'; maxThreadsPerMultiProcessor=2048 / wave64 = 32"
    pages: [hw-wavefront]

  - id: hv-partition-modes
    claim: "gfx950 compute modes are SPX/DPX/QPX/CPX; memory caps are NPS1/NPS2 (NPS4 not advertised)."
    verdict: refined
    method: "amd-smi partition (ACCELERATOR_PARTITION_PROFILES + MEMORY_PARTITION_CAPS)"
    pages: [hw-chiplet-xcd]

  - id: hv-fp64-throughput
    claim: "FP64 matrix per-CU throughput halved on gfx950 vs gfx942."
    verdict: source-reported
    method: "mfma_f64_16x16x4 opcode compiles on BOTH arches; the throughput ratio is a datasheet figure, not measured on this single host"
    pages: [hw-mxfp, migration-gfx942-to-gfx950]

  - id: hv-examples-on-hw
    claim: "All 12 examples/ build with --offload-arch=gfx950 AND run on the MI350X."
    verdict: confirmed
    method: "compiled+executed each on-device; 11/12 self-checks PASS"
    pages: []
    note: "fp8-gemm builds+runs but its main() never launches the kernel (self_check=none) — it only verifies the emitted MFMA instruction, not a numeric GEMM result."
