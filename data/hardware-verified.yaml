## Hardware-verification registry.
##
## Records claims that were checked by COMPILING / RUNNING / DISASSEMBLING real
## code on actual silicon (not just traced to a doc). Companion to
## version-claims.yaml. The full narrative + raw evidence excerpts live in
## ../VERIFICATION.md.
##
## VERIFICATION.md is the canonical human narrative; this file is its
## machine-readable index, and data/version-claims.yaml carries brief pointers
## back here. `claim` always states the *verified-true* fact (post-fix); `verdict`
## describes what happened to the wiki's ORIGINAL text after the on-hardware check.
##
## Schema per entry:
##   id:          stable identifier
##   claim:       the verified-true statement (the corrected fact, if the wiki was wrong)
##   verdict:     confirmed (wiki was already correct) | corrected (wiki was wrong, now fixed)
##                | refined (wiki right but sharpened) | source-reported (not measurable on-box)
##   method:      how it was checked on-hardware
##   pages:       wiki pages whose text this supports/corrects
##   also_verified_on: optional ids from additional_runs when a finding was
##                     independently repeated on another device/stack

gpu:
  marketing: "AMD Instinct MI350X"
  gfx: "gfx950:sramecc+:xnack-"
  arch: "CDNA4"
  verified_on: "2026-06-01"
  stack: {rocm: "7.2.0", hip: "7.2.26015", clang: "22.0.0git (roc-7.2.0)"}
  note: "Wiki content is pinned to ROCm 7.0.2 (data/tool-versions.yaml); these checks ran on the newer 7.2.0, so confirmations are strictly stronger. Double-checked by an independent adversarial re-run of every finding."

additional_runs:
  - id: run-mi355x-gfx950-rocm711-20260720
    gpu: {marketing: "AMD Instinct MI355X", gfx: "gfx950:sramecc+:xnack-", arch: "CDNA4"}
    verified_on: "2026-07-20"
    stack: {rocm: "7.1.1", hip: "7.1.52802", clang: "20.0.0git (roc-7.1.1)"}
    note: "HIP device properties, a 100-KiB dynamic-LDS launch, raw-buffer OOB, cross-lane reduction/swap, and target-padded transpose probes, plus the upstream empirical-LDS harness ran on an idle device; non-temporal snippets were also compiled for gfx950/gfx942. MI300X/gfx942 runtime access was unavailable because the required VPN route/SSH path timed out."

findings:
  - id: hv-specs
    claim: "256 CU, 32 shader engines, 4 SIMD/CU, wave64, L1 32KB, L2 4MB, MALL 256MB, 288GiB HBM3E, 2200MHz, 32 waves/CU; 8 XCDs x 32 active CU."
    verdict: confirmed
    method: "rocminfo + hipGetDeviceProperties + amd-smi partition"
    pages: [hw-chiplet-xcd, hw-wavefront]

  - id: hv-mi355-device-props
    claim: "MI355X/gfx950 reports 256 CUs, wave64, 2048 threads/CU, 160 KiB shared memory/CU, 4 MiB L2 per logical XCD device view, 288 GiB HBM3E, an 8192-bit memory bus, and a 2400 MHz maximum core clock through HIP properties."
    verdict: confirmed
    method: "hipGetDeviceProperties with ROCR_VISIBLE_DEVICES=0 on an idle MI355X"
    pages: [hw-chiplet-xcd, hw-wavefront, hw-lds]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]

  - id: hv-lds-160k
    claim: "gfx950 LDS is 160 KB/CU and is usable (a ~100KB dynamic extern __shared__ kernel launches and runs; would fail on gfx942's 64KB)."
    verdict: confirmed
    method: "sharedMemPerBlock=160KB; dynamic-LDS launch on-device"
    pages: [hw-lds, migration-gfx942-to-gfx950]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]

  - id: hv-fp8-ocp-vs-fnuz
    claim: "OCP FP8 (gfx950) and FNUZ FP8 (gfx942) are not bit-compatible: OCP-E4M3 max=448 vs FNUZ-E4M3 max=240; same byte decodes to different reals."
    verdict: confirmed
    method: "on-device encode/decode under both interpretations via hip_fp8.h"
    pages: [migration-gfx942-to-gfx950, kernel-fp8-gemm]

  - id: hv-f8f6f4-mfma
    claim: "Scaled f8f6f4 MFMA (MX/E8M0 block scaling) exists on gfx950, absent on gfx942."
    verdict: confirmed
    method: "__builtin_amdgcn_mfma_scale_f32_{16x16x128,32x32x64}_f8f6f4 compiles + emits v_mfma_scale_f32_*_f8f6f4 on gfx950; errors on gfx942; scaled kernel runs"
    pages: [hw-mfma, hw-mxfp, migration-gfx942-to-gfx950]
    note: "Clang exposes only the SCALED builtin; the unscaled v_mfma_f32_*_f8f6f4 is a real ISA mnemonic reachable via asm or ABID[0]=0."

  - id: hv-tf32-dropped
    claim: "Native TF32/XF32 matrix path is dropped on gfx950."
    verdict: confirmed
    method: "mfma_f32_16x16x8_xf32 / 32x32x4 compile for gfx942 but fail for gfx950 with backend 'Cannot select: intrinsic llvm.amdgcn.mfma.f32.16x16x8.xf32'"
    pages: [hw-mfma, hw-mxfp, migration-gfx942-to-gfx950]
    note: "Sharper than 'emulated via BF16' — the native intrinsic does not lower."

  - id: hv-direct-lds-width
    claim: "Direct-to-LDS async copy is <=4B (one dword) on gfx942 and widens to 12/16B on gfx950."
    verdict: corrected
    method: "__builtin_amdgcn_load_to_lds legal byte sizes {1,2,4} gfx942 vs {1,2,4,12,16} gfx950; emits global_load_lds_dword{,x3,x4}"
    pages: [hw-async-copy-lds, migration-gfx942-to-gfx950]
    note: "Corrected the migration page's '<=8B / dwordx2' to <=4B; no 8B/dwordx2 form exists on either generation."

  - id: hv-permlane16-swap
    claim: "gfx950 cross-lane uses v_permlane16/32_swap_b32, not the RDNA selector form; when both operands match, the partner is result element 1 in the lower half and element 0 in the upper half."
    verdict: corrected
    method: "Earlier compiler probes rejected permlanex16 on gfx950 ('needs target feature gfx10-insts'). On MI355X, a 64-lane runtime probe captured both permlane16/32_swap results and verified parity-selected partners equal lane^16/lane^32 for all lanes; the guarded fallback device-compiled for gfx942."
    pages: [hw-cross-lane, technique-wave-reduce, migration-gfx942-to-gfx950]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]
    note: "Corrected the builtin form and the result-element selection in all three examples."

  - id: hv-waves-per-cu
    claim: "Per-CU hardware wave ceiling is 32 (4 SIMD x 8 slots), not 40 (4x10)."
    verdict: corrected
    method: "MI350X rocminfo 'Max Waves Per CU: 32'; repeated on MI355X via maxThreadsPerMultiProcessor=2048 / wave64 = 32"
    pages: [hw-wavefront, technique-occupancy-tuning, technique-vgpr-budgeting, pattern-low-occupancy, pattern-vgpr-pressure]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]

  - id: hv-lds-bank-count-phase-gfx950
    claim: "On MI355X/gfx950, the upstream empirical harness identifies 64 LDS banks, one ds_read_b32 phase (lanes 0-63), and two ds_read_b64 phases (0-31 and 32-63)."
    verdict: refined
    method: "Built nod-ai/amd-shark-ai docs/empirical-lds/harness for gfx950; ran a 3-repeat ds_read_b64 bank-count sweep and 3/5-repeat b32/b64 phase classifications on an idle GPU."
    pages: [hw-lds]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]
    note: "The 3-repeat ds_read_b128 automatic classifier was unstable and did not reproduce the upstream four groups; b128 therefore remains upstream-empirical, not independently verified by this run."

  - id: hv-transpose-padding-gfx950
    claim: "For the block(32,32) fp32 transpose mapping, the example selects one pad dword on gfx942 and two on gfx950; the resulting static group-segment payloads are 4224 and 4352 bytes."
    verdict: corrected
    method: "Enumerated the documented b32 phase mapping; on MI355X compiled and exactly self-checked the gfx950 pad-2 kernel, then device-compiled the guarded source for gfx942 and inspected both group-segment sizes."
    pages: [kernel-transpose-lds]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]
    note: "The gfx950 run returned max abs error 0; conflict freedom follows from the reproduced phase model rather than a new PMC measurement."

  - id: hv-buffer-oob-gfx950
    claim: "A gfx950 raw-buffer descriptor with a 32-byte NumRecords window returns input values for the first eight scalar dwords and zero for the remaining lanes; a b128 load starting at byte 24 returns its two in-range dwords followed by two zeros. The same intrinsic probe cross-compiles for gfx942."
    verdict: confirmed
    method: "Compiled __builtin_amdgcn_make_buffer_rsrc + raw_buffer_load_b32/b128 for gfx950/gfx942; on MI355X checked all 64 scalar lanes plus a partially crossing four-dword vector."
    pages: [hw-memory-instructions, technique-buffer-oob-guard]
    also_verified_on: [run-mi355x-gfx950-rocm711-20260720]
    note: "The gfx9 raw-dword descriptor flags must be initialized (0x00020000 in this probe); flags=0 made every lane OOB. This validates small-window predication, not a >4-GiB runtime allocation."

  - id: hv-partition-modes
    claim: "gfx950 compute modes are SPX/DPX/QPX/CPX; memory caps are NPS1/NPS2 (NPS4 not advertised)."
    verdict: corrected
    method: "amd-smi partition (ACCELERATOR_PARTITION_PROFILES + MEMORY_PARTITION_CAPS)"
    pages: [hw-chiplet-xcd]

  - id: hv-fp64-throughput
    claim: "FP64 matrix per-CU throughput halved on gfx950 vs gfx942."
    verdict: source-reported
    method: "mfma_f64_16x16x4 opcode compiles on BOTH arches; the throughput ratio is a datasheet figure, not measured on this single host"
    pages: [hw-mxfp, migration-gfx942-to-gfx950]

  - id: hv-examples-on-hw
    claim: "All 12 examples/ build with --offload-arch=gfx950 AND run on the MI350X."
    verdict: confirmed
    method: "compiled+executed each on-device; 11/12 self-checks PASS"
    pages: []
    note: "fp8-gemm builds+runs but its main() never launches the kernel (self_check=none) — it only verifies the emitted MFMA instruction, not a numeric GEMM result."
