schema_version: 1

candidate:
  required:
    - source_id
    - source_kind
    - source_url
    - source_fingerprint
    - discovered_at
    - decision
    - relevance_reason
    - architectures
    - architecture_status
    - scope_status
    - trust
    - license
  enums:
    decision: [include, defer, exclude, quarantine]
    architecture_status: [path-evidence, metadata-evidence, unknown, out-of-scope]
    scope_status: [active, quarantine, out-of-scope]
    trust: [first-party, ecosystem, community-reviewed]

proposal:
  required:
    - id
    - generated_at
    - status
    - candidate_ids
    - proposed_action
    - affected_pages
    - confidence_proposal
    - experiment_request
  enums:
    status: [proposed, accepted, rejected, superseded]
    proposed_action: [create-source, update-page, create-page, add-alias, gather-evidence]
    confidence_proposal: [source-reported, inferred, experimental]

machine_change:
  allowed_roots:
    - sources/
    - wiki/
    - data/version-claims.yaml
  forbidden_confidence:
    - verified
