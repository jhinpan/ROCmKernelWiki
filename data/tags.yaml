## Controlled Vocabulary — Tags (ROCmKernelWiki)
## All tags used in source and wiki frontmatter must appear here.
## The validator (scripts/validate.py) rejects unknown tags.
## Targets: AMD CDNA3 (gfx942 / MI300), CDNA4 (gfx950 / MI350), RDNA4 (gfx1201).

architectures:
  - gfx942        # CDNA3 — MI300A/MI300X/MI325X
  - gfx950        # CDNA4 — MI350X/MI355X
  - gfx1201       # RDNA4 — Radeon AI PRO R9700 / RX 9070
  - gfx90a        # CDNA2 — MI200/MI250 (migration context only)
  - gfx1100       # RDNA3 — Radeon 7900 (WMMA context only)
  - gfx1250       # CDNA-next / MI450 (forward-looking)

hardware_features:
  - matrix-core           # MFMA/WMMA tensor units
  - mfma                  # Matrix Fused Multiply-Add (CDNA)
  - wmma                  # Wave Matrix Multiply-Accumulate (RDNA)
  - lds                   # Local Data Share (shared memory)
  - ds-instructions       # LDS read/write/permute ops
  - buffer-instructions   # buffer_load/store with OOB semantics
  - global-instructions   # global_load/store flat addressing
  - async-copy            # buffer_load_dword to LDS / global.load.lds
  - s-waitcnt             # vmcnt/lgkmcnt/expcnt counter waits
  - sgpr                  # scalar registers
  - vgpr                  # vector registers
  - agpr                  # accumulation registers (MFMA)
  - wave64                # 64-lane wavefront
  - wave32                # 32-lane wavefront
  - dpp                   # Data Parallel Primitives (cross-lane)
  - swizzle               # ds_swizzle / lane swizzle
  - permute               # ds_permute / ds_bpermute
  - fp8                   # OCP FP8 (E4M3/E5M2) and FNUZ variants
  - fp6                   # FP6 (gfx950)
  - fp4                   # FP4 / MXFP4 (gfx950)
  - mxfp                  # microscaling block formats (OCP MX)
  - bf16
  - fp16
  - tf32                  # xf32 on CDNA
  - int8
  - block-scale           # per-block scaling for narrow precision
  - xcd                   # Accelerator Complex Die (MI300 chiplet)
  - cu                    # Compute Unit
  - l2-cache
  - infinity-cache        # RDNA last-level cache
  - hbm3                  # MI300 memory
  - cdna                  # CDNA architecture family
  - rdna                  # RDNA architecture family

