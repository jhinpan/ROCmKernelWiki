schema_version: 1
thresholds:
  case_pass_rate: 1.0
  citation_validity_rate: 1.0

cases:
  - id: A01
    architecture: both
    question: Can gfx942 FP8 weights move unchanged to gfx950?
    required_patterns: ["gfx942.*FNUZ", "gfx950.*OCP", "not bit-compatible"]
    forbidden_patterns: ["bit-compatible across", "same FP8 encoding"]
    required_citations: [migration-gfx942-to-gfx950]

  - id: A02
    architecture: both
    question: Compare LDS capacity and banks on gfx942 and gfx950.
    required_patterns: ["gfx942.*64 (?:KB|KiB).*32 banks", "gfx950.*160 (?:KB|KiB).*64 banks"]
    forbidden_patterns: ["gfx950.*32 banks"]
    required_citations: [hw-lds]

  - id: A03
    architecture: both
    question: What is the resident-wave ceiling per CU?
    required_patterns: ["32 waves/CU|32 wavefronts per CU", "8.*(?:SIMD|slot)"]
    forbidden_patterns: ["40 waves/CU", "10 waves/SIMD"]
    required_citations: [hw-wavefront]

  - id: A04
    architecture: both
    question: How wide is direct-to-LDS?
    required_patterns: ["gfx942.*(?:4 B|4-byte)", "gfx950.*(?:12|16).*(?:B|byte)"]
    forbidden_patterns: ["gfx942.*8-byte"]
    required_citations: [hw-async-copy-lds]

  - id: A05
    architecture: gfx950
    question: Does native XF32 MFMA lower on gfx950?
    required_patterns: ["fails? to select|does not lower|unavailable"]
    forbidden_patterns: ["native XF32.*\\bis available on gfx950\\b"]
    required_citations: [hw-mfma]

  - id: A06
    architecture: both
    question: Which permlane operation is available on gfx950?
    required_patterns: ["v_permlane16_swap_b32", "absent on gfx942|gfx950-only"]
    forbidden_patterns: ["permlanex16.*CDNA4"]
    required_citations: [hw-cross-lane]

  - id: A07
    architecture: both
    question: What do out-of-range raw buffer reads return?
    required_patterns: ["return zero|zero-fill"]
    forbidden_patterns: ["undefined value"]
    required_citations: [technique-buffer-oob-guard]

  - id: A08
    architecture: gfx950
    question: Report the source-reported CDNA4 FP8 GEMM result responsibly.
    required_patterns: ["MI355X", "FP8", "M=N=K", "TFLOPS", "source-reported|unreproduced"]
    forbidden_patterns: ["verified by this harness"]
    required_citations: [kernel-fp8-gemm, blog-fp8-gemm-cdna4]

  - id: A09
    architecture: gfx942
    question: Is the current gfx942 guidance runtime-verified on MI300 hardware?
    required_patterns: ["compile-only|source-backed", "no MI300.*runtime|MI300.*unavailable"]
    forbidden_patterns: ["\\bis runtime-verified on MI300\\b", "has been runtime-verified on MI300"]
    required_citations: [hw-wavefront]

  - id: A10
    architecture: both
    question: Should an AMD port use CUDA TMA or mbarrier?
    required_patterns: ["no TMA|does not have TMA", "direct-to-LDS", "s_waitcnt"]
    forbidden_patterns: ["use mbarrier on CDNA"]
    required_citations: [migration-cuda-to-hip]
