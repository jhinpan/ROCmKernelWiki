schema_version: 1

# These are fixed, architecture-scoped A/B tasks. The worker records both arms
# under the same immutable environment fingerprint; correctness is mandatory
# before any performance comparison is reported.
tasks:
  - id: direct-lds-contract
    architecture: gfx950
    prompt: Preserve the 16-byte direct-to-LDS pointer/sentinel contract while improving the kernel.
    allowed_paths: [validation/probes/direct_lds_runtime.hip]
    correctness_command: python3 validation/run.py --check
    metric:
      name: runtime_seconds
      direction: lower
      source: wall-clock
    budget_minutes: 20

  - id: transpose-lds
    architecture: gfx950
    prompt: Improve the gfx950 LDS transpose without changing exact numerical output.
    allowed_paths: [examples/transpose-lds/transpose_lds.cpp]
    build_command: ROCM_WIKI_BUILD_ONLY=1 bash examples/transpose-lds/build.sh
    correctness_command: bash examples/transpose-lds/build.sh
    benchmark_command: bash examples/transpose-lds/build.sh
    metric:
      name: effective_bandwidth_gbps
      direction: higher
      source: stdout
      regex: "effective BW:\\s*([0-9.]+) GB/s"
    budget_minutes: 30

  - id: rmsnorm
    architecture: gfx950
    prompt: Improve the fused RMSNorm while preserving every committed self-check case.
    allowed_paths: [examples/rmsnorm/rmsnorm.hip.cpp]
    build_command: ROCM_WIKI_BUILD_ONLY=1 bash examples/rmsnorm/build.sh
    correctness_command: bash examples/rmsnorm/build.sh
    benchmark_command: bash examples/rmsnorm/build.sh
    metric:
      name: median_kernel_us
      direction: lower
      source: stdout
      regex: "rmsnorm fp32\\s+.*?PASS\\s+([0-9.]+) ms"
      scale: 1000.0
    budget_minutes: 30

  - id: fused-moe
    architecture: gfx950
    prompt: Improve the fused MoE reference under its fixed shape and correctness checks.
    allowed_paths: [examples/fused-moe/fused_moe.cpp]
    build_command: ROCM_WIKI_BUILD_ONLY=1 bash examples/fused-moe/build.sh
    correctness_command: bash examples/fused-moe/build.sh
    benchmark_command: bash examples/fused-moe/build.sh
    metric:
      name: median_iteration_us
      direction: lower
      source: stdout
      regex: "kernel time:\\s*([0-9.]+) us/iter"
    budget_minutes: 45
