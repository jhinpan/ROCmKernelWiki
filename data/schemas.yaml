    - prerequisites
    - evidence_basis
    - cross_vendor_note

wiki-technique:
  required:
    - id
    - title
    - type
    - architectures
    - tags
    - confidence
    - reproducibility
    - related
    - sources
  optional:
    - hardware_features
    - kernel_types
    - languages
    - evidence_basis

wiki-kernel:
  required:
    - id
    - title
    - type
    - architectures
    - tags
    - confidence
    - reproducibility
    - kernel_types
    - languages
    - related
    - sources
    - performance_claims
  optional:
    - hardware_features
    - techniques
    - artifact_dir
    - evidence_basis
  performance_claims_schema:
    required:
      - gpu
      - dtype
      - metric
      - value
      - source_id
    optional:
      - shape
      - utilization
      - baseline

wiki-pattern:
