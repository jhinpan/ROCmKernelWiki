## Page-Type Schemas (ROCmKernelWiki)
## Defines required and optional fields per page type.
## Consumed by scripts/validate.py

source-pr:
  required:
    - id
    - repo
    - pr
    - title
    - author
    - date
    - url
    - source_category
    - architectures
    - tags
    - techniques
    - hardware_features
    - kernel_types
    - languages
    - captured_at
    - status
  optional:
    - merge_sha
    - description
    - inclusion_reason
    - changed_paths
    - artifact_dir
  constraints:
    source_category: upstream-code
    status: [open, merged, closed]
    merge_sha_required_when: "status == merged"

source-doc:
  required:
    - id
    - title
    - url
    - source_category
    - architectures
    - tags
    - retrieved_at
  optional:
    - author
    - description
  constraints:
    source_category: [official-doc, paper]

source-blog:
  required:
    - id
    - title
    - author
    - url
    - source_category
    - architectures
    - tags
    - retrieved_at
  optional:
    - description
    - artifact_dir
  constraints:
    source_category: [benchmark-blog, community-note]

source-ref:
  required:
    - id
    - title
    - repo
    - url
    - source_category
    - architectures
    - tags
    - retrieved_at
  optional:
    - author
    - description
    - languages
    - artifact_dir
  constraints:
    source_category: reference-repo

wiki-hardware:
  required:
