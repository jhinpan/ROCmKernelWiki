## Page-Type Schemas (ROCmKernelWiki)
## Defines required and optional fields per page type.
## Consumed by scripts/validate.py

source-pr:
  required:
    - id
    - repo
    - pr
    - title
    - author
    - date
    - url
    - source_category
    - architectures
    - tags
    - techniques
    - hardware_features
    - kernel_types
    - languages
    - captured_at
    - status
  optional:
    - merge_sha
    - description
    - inclusion_reason
    - changed_paths
    - artifact_dir
    - related            # reverse links to wiki synthesis pages (link_prs.py)
    - facet_source       # 'inferred' when facets were machine-derived (enrich_facets.py)
    - source_fingerprint # immutable repo/PR/merge identity
    - source_license
    - source_trust
    - scope_status       # active | quarantine | out-of-scope
  constraints:
    source_category: upstream-code
    status: [open, merged, closed]
    merge_sha_required_when: "status == merged"

source-doc:
  required:
    - id
    - title
    - url
    - source_category
    - architectures
    - tags
    - retrieved_at
  optional:
    - author
    - description
  constraints:
    source_category: [official-doc, paper]

