# Canonical machine-checkable values for cross-page architecture claims.
# Prose may explain these facts in different ways, but pages referencing the
# version claim must preserve the required semantic markers below.

schema_version: 1
claims:
  - id: vs-fp8-fnuz-gfx942
    architectures: [gfx942]
    values:
      encoding: FNUZ
      ocp_bit_compatible: false
    required_patterns:
      - "\\bFNUZ\\b"

  - id: vs-fp8-ocp-gfx950
    architectures: [gfx950]
    values:
      encoding: OCP
      narrow_formats: [fp8, fp6, fp4]
    required_patterns:
      - "\\bOCP\\b"

  - id: vs-lds-size-gfx950
    architectures: [gfx942, gfx950]
    values:
      gfx942:
        bytes_per_cu: 65536
        banks: 32
      gfx950:
        bytes_per_cu: 163840
        banks: 64
    required_patterns:
      - "160\\s*(?:KB|KiB)"
      - "64 banks"

  - id: vs-wave-slots-cdna3-cdna4
    architectures: [gfx942, gfx950]
    values:
      waves_per_simd: 8
      simds_per_cu: 4
      waves_per_cu: 32
    required_patterns:
      - "32[- ]wave|32 waves"
      - "4\\s*(?:×|x)\\s*8|8 (?:waves|resident-wave slots|wave slots)"
