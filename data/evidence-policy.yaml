# Evidence labels must agree with the category of the referenced source page.
allowed_source_categories:
  official-doc: [official-doc]
  upstream-code: [upstream-code, reference-repo]
  paper: [paper]
  benchmark: [benchmark-blog]
  reproduction: [reference-repo]
  inference:
    [official-doc, upstream-code, paper, benchmark-blog, reference-repo, community-note]

verified_requires:
  - official-doc
  - one_of: [upstream-code, paper]

# Machine-authored changes are proposals. A human review may accept their
# source-reported/inferred content, but hardware truth cannot self-promote.
machine_authored_forbidden_confidence:
  - verified

performance_reproduction:
  reproduced_by:
    - validation-result
    - benchmark-artifact
  unreproduced_flag: unreproduced
