## Inclusion policy for PR harvesting and classification.
## Consumed by scripts/harvest_prs.py to classify each merged PR as
## include / defer / exclude, and to assign a preliminary tag set.

## A PR is INCLUDED when it touches kernel-level GPU code for a tracked
## architecture: device kernels (.cu/.cpp/.hip/.s/.asm), CK/CK-tile templates,
## MFMA/WMMA codegen, Triton/FlyDSL kernels, or assembly. Host-only plumbing,
## CI, docs, and build-system-only changes are EXCLUDED.

tracked_repos:
  - repo: ROCm/composable_kernel
    short: composable_kernel
    focus: "CK / CK-tile GEMM, attention, fused MoE, normalization on CDNA"
    default_languages: [composable-kernel, hip, cpp]
  - repo: ROCm/aiter
    short: aiter
    focus: "AMD AI Tensor Engine: fused MoE, attention, GEMM, quant kernels"
    default_languages: [hip, cpp, triton]
  - repo: ROCm/hipBLASLt
    short: hipBLASLt
    focus: "GEMM epilogue fusion, FP8 GEMM, gfx942/gfx950 solutions"
    default_languages: [hip, cpp, gcn-asm]
  - repo: ROCm/Tensile
    short: Tensile
    focus: "Assembly GEMM kernel generator for rocBLAS/hipBLASLt"
    default_languages: [gcn-asm, python]
  - repo: ROCm/rocBLAS
    short: rocBLAS
    focus: "BLAS on ROCm; Tensile-backed GEMM"
    default_languages: [hip, cpp]
  - repo: ROCm/flash-attention
    short: flash-attention
    focus: "FlashAttention CK/Triton kernels for CDNA"
    default_languages: [composable-kernel, triton, hip]
  - repo: ROCm/FlyDSL
    short: FlyDSL
    focus: "MLIR-native layout DSL: GEMM, MoE, attention, norm on AMD"
    default_languages: [flydsl, mlir, python]
  - repo: ROCm/triton
    short: triton
    focus: "Triton AMD backend: MFMA lowering, async copy, FP8"
    default_languages: [triton, mlir]
  - repo: vllm-project/vllm
    short: vllm
    focus: "vLLM ROCm path: paged attention, fused MoE, quant on MI300/MI350"
    default_languages: [hip, triton, python]
    rocm_filter: true
  - repo: sgl-project/sglang
    short: sglang
    focus: "SGLang ROCm path: attention, MoE, quant kernels on AMD"
    default_languages: [hip, triton, python]
    rocm_filter: true

## Path globs that signal kernel-level inclusion.
include_path_globs:
  - "**/*.cu"
  - "**/*.cuh"
  - "**/*.hip"
  - "**/*.s"
  - "**/*.asm"
  - "**/*.inc"
  - "**/*kernel*"
  - "**/*mfma*"
  - "**/*wmma*"
  - "**/*gemm*"
  - "**/*attention*"
  - "**/*flash*"
  - "**/*moe*"
  - "**/*.py"      # Triton / FlyDSL kernels (further filtered by content keywords)

## Title/keyword signals that boost inclusion confidence.
include_keywords:
  - mfma
  - wmma
  - gemm
  - attention
  - flash
  - moe
  - fp8
  - fp4
  - mxfp
  - kernel
  - gfx942
  - gfx950
  - gfx1201
  - mi300
  - mi350
  - lds
  - async
  - quant
  - rmsnorm
  - layernorm
  - rope
  - paged
  - decode
  - prefill

## Signals that force EXCLUDE regardless of paths.
exclude_keywords:
  - "ci:"
  - "[ci]"
  - "bump version"
  - "update changelog"
  - "fix typo"
  - "docs:"
  - "doc:"
  - "readme"
  - "pre-commit"
  - "lint"

## For repos with rocm_filter: true, a PR is only considered if its title,
## body, or changed paths mention one of these AMD/ROCm markers.
rocm_markers:
  - rocm
  - hip
  - amd
  - gfx942
  - gfx950
  - mi300
  - mi350
  - aiter
  - cdna
  - mfma
