# Canonical source registry for the self-evolving evidence pipeline.
# Source discovery, trust policy, path filtering, and licensing metadata live
# here. data/inclusion-policy.yaml remains the controlled keyword policy.

schema_version: 1

defaults:
  active_architectures: [gfx942, gfx950]
  max_candidates_per_run: 200
  max_source_pages_per_run: 50
  diff_bytes: 262144

sources:
  - id: rocm-aiter
    kind: github-prs
    repo: ROCm/aiter
    short: aiter
    trust: first-party
    license: MIT
    default_languages: [hip, cpp, triton, flydsl, python]
    include_paths:
      - "**/*.cu"
      - "**/*.cuh"
      - "**/*.hip"
      - "**/*kernel*"
      - "**/*gemm*"
      - "**/*attention*"
      - "**/*moe*"
      - "aiter/aot/flydsl/**"
    require_positive_path_signal: true

  - id: rocm-flydsl
    kind: github-prs
    repo: ROCm/FlyDSL
    short: FlyDSL
    trust: first-party
    license: Apache-2.0
    default_languages: [flydsl, mlir, python]
    include_paths:
      - "flydsl/**"
      - "examples/**"
      - "tests/kernel/**"
      - "**/*.mlir"
      - "**/*kernel*"
      - "**/*gemm*"
      - "**/*attention*"
      - "**/*moe*"
    require_positive_path_signal: true

  - id: rocm-atom
    kind: github-prs
    repo: ROCm/ATOM
    short: ATOM
    trust: first-party
    license: MIT
    default_languages: [python, hip, triton]
    include_paths:
      - "atom/model_ops/**"
      - "atom/**/kernels/**"
      - "atom/**/*kernel*"
      - "atom/**/*attention*"
      - "atom/**/*moe*"
      - "atom/**/*quant*"
    require_positive_path_signal: true

  - id: rocm-rocm-libraries
    kind: github-prs
    repo: ROCm/rocm-libraries
    branch: develop
    short: rocm-libraries
    trust: first-party
    license: mixed-upstream
    default_languages: [hip, cpp, gcn-asm, composable-kernel, python]
    component_paths:
      composable-kernel:
        - "projects/composablekernel/**"
      hipblaslt:
        - "projects/hipblaslt/**"
      tensile:
        - "projects/hipblaslt/tensilelite/**"
        - "shared/tensile/**"
      rocblas:
        - "projects/rocblas/**"
    include_paths:
      - "projects/composablekernel/**"
      - "projects/hipblaslt/**"
      - "projects/rocblas/**"
      - "shared/tensile/**"
      - "shared/stinkytofu/**"
    require_positive_path_signal: true

  - id: rocm-triton
    kind: github-prs
    repo: ROCm/triton
    short: triton
    trust: first-party
    license: MIT
    default_languages: [triton, mlir, cpp, python]
    include_paths:
      - "third_party/amd/**"
      - "lib/**/AMDGPU/**"
      - "python/**/amd/**"
      - "**/*amdgpu*"
      - "**/*mfma*"
      - "**/*kernel*"
    require_positive_path_signal: true

  - id: rocm-flash-attention
    kind: github-prs
    repo: ROCm/flash-attention
    short: flash-attention
    trust: first-party
    license: BSD-3-Clause
    default_languages: [composable-kernel, triton, hip, cpp]
    include_paths:
      - "**/*.cu"
      - "**/*.cuh"
      - "**/*.hip"
      - "**/*attention*"
      - "**/*fmha*"
      - "**/*kernel*"
    require_positive_path_signal: true

  - id: vllm-rocm
    kind: github-prs
    repo: vllm-project/vllm
    short: vllm
    trust: ecosystem
    license: Apache-2.0
    default_languages: [hip, triton, python]
    include_paths:
      - "csrc/rocm/**"
      - "vllm/**/rocm/**"
      - "vllm/**/*aiter*"
      - "vllm/**/*kernel*"
      - "vllm/**/*triton*"
    require_rocm_marker: true
    require_positive_path_signal: true

  - id: sglang-rocm
    kind: github-prs
    repo: sgl-project/sglang
    short: sglang
    trust: ecosystem
    license: Apache-2.0
    default_languages: [hip, triton, python]
    include_paths:
      - "sgl-kernel/**"
      - "python/sglang/**/rocm/**"
      - "python/sglang/**/*aiter*"
      - "python/sglang/**/*kernel*"
      - "python/sglang/**/*triton*"
    require_rocm_marker: true
    require_positive_path_signal: true

  - id: rocm-blogs
    kind: github-tree
    repo: ROCm/rocm-blogs
    branch: release
    short: rocm-blogs
    trust: first-party
    license: mixed-upstream
    source_category: benchmark-blog
    include_paths:
      - "blogs/**/README.md"
      - "**/README.md"
      - "**/*.ipynb"
      - "**/*.hip"
      - "**/*.cu"
    include_keywords:
      - MI300
      - MI350
      - MI355
      - gfx942
      - gfx950
      - kernel
      - MFMA
      - LDS
      - Triton
      - FlyDSL
      - AITER

  - id: amdgpu-optimization-guide
    kind: github-tree
    repo: nod-ai/amd-shark-ai
    branch: main
    short: amdgpu-guide
    trust: community-reviewed
    license: Apache-2.0
    source_category: community-note
    include_paths:
      - "docs/AMDGPU-Kernel-Optimization/**"
      - "docs/empirical-lds/**"

  # Historical repositories remain queryable but are read-only mirrors. New
  # development is harvested from ROCm/rocm-libraries to avoid duplicates.
  - id: legacy-composable-kernel
    kind: github-prs
    repo: ROCm/composable_kernel
    short: composable_kernel
    trust: first-party
    license: MIT
    active: false
    mirror_of: rocm-rocm-libraries

  - id: legacy-hipblaslt
    kind: github-prs
    repo: ROCm/hipBLASLt
    short: hipBLASLt
    trust: first-party
    license: MIT
    active: false
    mirror_of: rocm-rocm-libraries

  - id: legacy-tensile
    kind: github-prs
    repo: ROCm/Tensile
    short: Tensile
    trust: first-party
    license: MIT
    active: false
    mirror_of: rocm-rocm-libraries

  - id: legacy-rocblas
    kind: github-prs
    repo: ROCm/rocBLAS
    short: rocBLAS
    trust: first-party
    license: MIT
    active: false
    mirror_of: rocm-rocm-libraries
