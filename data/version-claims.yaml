## Version-sensitive claims registry.
##
## Statements whose truth depends on a specific ROCm / library / hardware version
## are recorded here with a stable id. Wiki pages making such a claim should add a
## `version_sensitive: [<id>, ...]` frontmatter pointer so an agent (and the
## reader) knows the claim can go stale and against which version it was true.
##
## scripts/validate.py checks that every `version_sensitive` pointer resolves to
## an id defined here (and warns on registry entries that pin a tool version not
## present in data/tool-versions.yaml).
##
## NOTE: the hardware/compiler-dependent claims below were re-verified on real
## silicon — an AMD Instinct MI350X (gfx950/CDNA4), ROCm 7.2.0 / clang 22 — on
## 2026-06-01 (newer than the pinned ROCm 7.0.2, so the confirmations hold). See
## data/hardware-verified.yaml for the per-claim evidence and ../VERIFICATION.md
## for the raw method. Entries that were hardware-checked carry `hardware_verified`.
##
## Schema per entry:
##   id:            stable identifier (referenced from page frontmatter)
##   claim:         the version-dependent statement
##   pinned_to:     {tool: version} this claim is anchored to
##   verified_on:   date the claim was checked
##   supersede_if:  human note on what would invalidate it

claims:
  - id: vs-fp8-fnuz-gfx942
    claim: "gfx942 (CDNA3) FP8 uses the FNUZ encoding (E4M3/E5M2 FNUZ), NOT OCP FP8; it is not bit-compatible with gfx950 OCP FP8."
    pinned_to: {rocm: "7.0.2"}
    verified_on: "2026-05-30"
    supersede_if: "AMD ships an OCP-FP8 path for gfx942 in a future ROCm/firmware."

  - id: vs-fp8-ocp-gfx950
    claim: "gfx950 (CDNA4) FP8 is OCP FP8; FP6/FP4 and MX (E8M0) block scaling are available via the f8f6f4 / v_mfma_scale_* MFMA path."
    pinned_to: {rocm: "7.0.2", llvm: "20"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-fp8-ocp-vs-fnuz, hv-f8f6f4-mfma]}
    supersede_if: "New CDNA generation changes the low-precision MFMA encoding."

  - id: vs-lds-size-gfx950
    claim: "LDS is 64 KB/CU with 32 banks on gfx942 and 160 KB/CU with 64 banks on gfx950."
    pinned_to: {rocm: "7.0.2"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-lds-160k], note: "160KB capacity confirmed on-device; 64-bank count is ISA-derived (counter-observable, not stopwatch-observable)."}
    supersede_if: "A new CDNA part changes per-CU LDS capacity or bank count."

  - id: vs-permlane16-gfx950
    claim: "v_permlane16_* cross-lane ops exist on gfx950 (CDNA4) but are absent on gfx942 (CDNA3); portable wave reductions on gfx942 use DPP + ds_bpermute."
    pinned_to: {rocm: "7.0.2", llvm: "20"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-permlane16-swap], note: "The gfx950 op is v_permlane16_swap_b32 (__builtin_amdgcn_permlane16_swap); the RDNA selector-form permlanex16 does NOT compile for CDNA4."}
    supersede_if: "Backport/forward-port of permlane ops to another gfx target."

  - id: vs-triton-kpack-gfx950
    claim: "The Triton AMD backend's `kpack` knob is deprecated starting from gfx950; `matrix_instr_nonkdim`, `waves_per_eu`, and `num_stages` remain the primary MFMA-tuning knobs."
    pinned_to: {triton: "3.4.0"}
    verified_on: "2026-05-30"
    supersede_if: "Triton AMD backend changes its tuning-knob surface."

  - id: vs-ck-tile-status
    claim: "Composable Kernel's newer self-contained DSL is `ck_tile` (single-header components, warp/block/pipeline/kernel tiers); active development has moved to the ROCm/rocm-libraries monorepo."
    pinned_to: {composable_kernel: "1.1.0"}
    verified_on: "2026-05-30"
    supersede_if: "CK restructures its API or repo layout."

  - id: vs-tf32-dropped-gfx950
    claim: "The native TF32/XF32 matrix MFMA was dropped on gfx950 — the v_mfma_f32_*_xf32 intrinsic fails to select for gfx950 (use explicit BF16). FP64 matrix throughput per CU was halved vs gfx942 (datasheet figure; the FP64 MFMA opcode itself still compiles on gfx950)."
    pinned_to: {rocm: "7.0.2"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-tf32-dropped, hv-fp64-throughput], note: "TF32-dropped confirmed on-device (Cannot select); FP64-halved remains source-reported (not measured on a single host)."}
    supersede_if: "A future CDNA part re-introduces a native TF32 matrix path."
