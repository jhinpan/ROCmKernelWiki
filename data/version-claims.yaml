## Version-sensitive claims registry.
##
## Statements whose truth depends on a specific ROCm / library / hardware version
## are recorded here with a stable id. Wiki pages making such a claim should add a
## `version_sensitive: [<id>, ...]` frontmatter pointer so an agent (and the
## reader) knows the claim can go stale and against which version it was true.
##
## scripts/validate.py checks that every `version_sensitive` pointer resolves to
## an id defined here (and warns on registry entries that pin a tool version not
## present in data/tool-versions.yaml).
##
## NOTE: hardware/compiler-dependent claims were re-verified on real gfx950
## silicon: MI350X / ROCm 7.2.0 / clang 22 on 2026-06-01, with guide-specific
## MI355X / ROCm 7.1.1 / clang 20 checks added on 2026-07-20. See
## data/hardware-verified.yaml for per-claim evidence and ../VERIFICATION.md for
## methods and explicit limits. Hardware-checked entries carry
## `hardware_verified`.
##
## Schema per entry:
##   id:            stable identifier (referenced from page frontmatter)
##   claim:         the version-dependent statement
##   pinned_to:     {tool: version} this claim is anchored to
##   verified_on:   date the claim was checked
##   supersede_if:  human note on what would invalidate it

claims:
  - id: vs-fp8-fnuz-gfx942
    claim: "gfx942 (CDNA3) FP8 uses the FNUZ encoding (E4M3/E5M2 FNUZ), NOT OCP FP8; it is not bit-compatible with gfx950 OCP FP8."
    pinned_to: {rocm: "7.0.2"}
    verified_on: "2026-05-30"
    supersede_if: "AMD ships an OCP-FP8 path for gfx942 in a future ROCm/firmware."

  - id: vs-fp8-ocp-gfx950
    claim: "gfx950 (CDNA4) FP8 is OCP FP8; FP6/FP4 and MX (E8M0) block scaling are available via the f8f6f4 / v_mfma_scale_* MFMA path."
    pinned_to: {rocm: "7.0.2", llvm: "20"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-fp8-ocp-vs-fnuz, hv-f8f6f4-mfma]}
    supersede_if: "New CDNA generation changes the low-precision MFMA encoding."

  - id: vs-lds-size-gfx950
    claim: "LDS is 64 KB/CU with 32 banks and 512-byte allocation units on gfx942; gfx950 has 160 KB/CU, 64 banks, and 1280-byte allocation units."
    pinned_to: {rocm: "7.1.1"}
    verified_on: "2026-07-20"
    hardware_verified: {on: "2026-07-20", gpu: "MI350X and MI355X gfx950", stack: "ROCm 7.2.0 and 7.1.1", evidence: [hv-lds-160k, hv-lds-bank-count-phase-gfx950], note: "160 KiB capacity was confirmed by properties and >64-KiB launches; the purpose-built empirical harness reproduced the 64-bank signal plus b32/b64 groups on MI355X."}
    supersede_if: "A new CDNA part changes per-CU LDS capacity, bank count, or allocation unit."

  - id: vs-wave-slots-cdna3-cdna4
    claim: "gfx942 and gfx950 have 8 resident-wave slots per SIMD and a 32-wave-per-CU ceiling (4 SIMD x 8), not the guide's 10/40 value."
    pinned_to: {rocm: "7.1.1"}
    verified_on: "2026-07-20"
    hardware_verified: {on: "2026-07-20", gpu: "MI355X gfx950", stack: "ROCm 7.1.1 / HIP 7.1.52802 / clang 20 (roc-7.1.1)", evidence: [hv-waves-per-cu], note: "gfx950 was re-verified on MI355X; gfx942 remains official/source-backed until MI300 runtime access is restored."}
    supersede_if: "The reported residency limit changes for either named architecture."

  - id: vs-cdna-unified-vgpr-agpr-allocation
    claim: "On gfx942/gfx950, ArchVGPR and AGPR names draw from one combined 512-entry-per-lane physical allocation and occupancy budget; they are architectural views, not independent 256-entry capacity banks."
    pinned_to: {rocm: "7.1.1", llvm: "20"}
    verified_on: "2026-07-20"
    supersede_if: "The AMDGPU ABI, compiler resource accounting, or a later CDNA register-file organization changes."

  - id: vs-lds-phase-groups-gfx942-gfx950
    claim: "The exact LDS lane-phase tables are empirical, opcode-specific results: gfx942 uses 2/4/8 groups for ds_read_b32/b64/b128, while gfx950 uses 1/2/4. On MI355X/ROCm 7.1.1 this pass reproduced the gfx950 64-bank count plus b32 and b64 groups; b128 and gfx942 remain upstream-empirical."
    pinned_to: {rocm: "7.1.1", llvm: "20"}
    verified_on: "2026-07-20"
    hardware_verified: {on: "2026-07-20", gpu: "MI355X gfx950", stack: "ROCm 7.1.1 / HIP 7.1.52802 / clang 20", evidence: [hv-lds-bank-count-phase-gfx950], note: "The MI355X pass reproduced 64 banks plus b32/b64 groups; b128 and every gfx942 group remain upstream-empirical."}
    supersede_if: "A different GPU stepping, LDS opcode behavior, compiler, or more reliable empirical harness produces different groups."

  - id: vs-permlane16-gfx950
    claim: "v_permlane16_swap_b32 and v_permlane32_swap_b32 exist on gfx950 (CDNA4) but are absent on gfx942 (CDNA3); the similarly named RDNA selector form is not available on CDNA4, and portable gfx942 wave reductions use DPP + ds_bpermute."
    pinned_to: {rocm: "7.0.2", llvm: "20"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-permlane16-swap], note: "The gfx950 op is v_permlane16_swap_b32 (__builtin_amdgcn_permlane16_swap); the RDNA selector-form permlanex16 does NOT compile for CDNA4."}
    supersede_if: "Backport/forward-port of permlane ops to another gfx target."

  - id: vs-mlir-dpp-combine-llvm20
    claim: "In the captured LLVM/MLIR 20 pipeline, amdgpu.dpp wraps rocdl.update.dpp and the AMDGPU backend may fuse its DPP move into a following compatible VALU instruction; non-full row or bank masks can inhibit the combine."
    pinned_to: {llvm: "20"}
    verified_on: "2026-07-20"
    supersede_if: "MLIR AMDGPU/ROCDL lowering or LLVM GCNDPPCombine behavior changes."

  - id: vs-amdgpu-nontemporal-lowering
    claim: "ROCm 7.1.1 clang 20 lowers __builtin_nontemporal_load/store on a native 4xf32 vector to global_load/store_dwordx4 with the nt modifier for both gfx942 and gfx950; the HIP float4 wrapper is not accepted by those builtins in this compiler."
    pinned_to: {rocm: "7.1.1", llvm: "20"}
    verified_on: "2026-07-20"
    supersede_if: "Clang changes accepted vector types or AMDGPU non-temporal cache-policy lowering."

  - id: vs-triton-kpack-gfx950
    claim: "The Triton AMD backend's `kpack` knob is deprecated starting from gfx950; `matrix_instr_nonkdim`, `waves_per_eu`, and `num_stages` remain the primary MFMA-tuning knobs."
    pinned_to: {triton: "3.4.0"}
    verified_on: "2026-05-30"
    supersede_if: "Triton AMD backend changes its tuning-knob surface."

  - id: vs-ck-tile-status
    claim: "Composable Kernel's newer self-contained DSL is `ck_tile` (single-header components, warp/block/pipeline/kernel tiers); active development has moved to the ROCm/rocm-libraries monorepo."
    pinned_to: {composable_kernel: "1.1.0"}
    verified_on: "2026-05-30"
    supersede_if: "CK restructures its API or repo layout."

  - id: vs-tf32-dropped-gfx950
    claim: "The native TF32/XF32 matrix MFMA was dropped on gfx950 — the v_mfma_f32_*_xf32 intrinsic fails to select for gfx950, so software must explicitly choose BF16 or another supported path. FP64 matrix throughput per CU was halved vs gfx942 (datasheet figure; the FP64 MFMA opcode itself still compiles on gfx950)."
    pinned_to: {rocm: "7.0.2"}
    verified_on: "2026-05-30"
    hardware_verified: {on: "2026-06-01", gpu: "MI350X gfx950", stack: "ROCm 7.2.0", evidence: [hv-tf32-dropped, hv-fp64-throughput], note: "TF32-dropped confirmed on-device (Cannot select); FP64-halved remains source-reported (not measured on a single host)."}
    supersede_if: "A future CDNA part re-introduces a native TF32 matrix path."
