  untrusted_excerpt: 'Summary

    Harden the SGLang accuracy validation helper script without changing model configs,
    thresholds, image versions, or runtime code.

    Why This Is Needed

    The SGLang accuracy workflow runs inside a container while mounting the GitHub
    workspace from the host. Without these script-level safeguards, validation can
    still be flaky even after the workflow-level hardening in #1668:


    Python may write root-owned __pycache__ files into the mounted workspace, causing
    later checkout or cleanup steps to fail.

    localhost may resolve to IPv6 ::1, while Docker/container networking can have
    IPv6 disabled, causing readiness checks to fail even when the server is listening
    on IPv4.

    Some images contain a baked /app/ATOM copy. If that path takes precedence over
    the mounted /workspace, the job may validate stale image code instead of the PR
    checkout.


    This PR keeps validation focused on the current checkout and reduces avoidable
    CI flakes without changing model configs, thresholds, image versions, or runtime
    behavior.

    Relation to #1668

    This is a follow-up hardening change to #1668, but it is independent and touches
    a different layer.

