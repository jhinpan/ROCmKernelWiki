  untrusted_excerpt: "At small-T decode (low occupancy / latency-bound) the fine-grained\
    \ fused_qk_norm_rope kernel computed the RoPE cos/sin pointers -- which need a\
    \ dependent positions[token_idx] scalar load -- BEFORE issuing the main q/kv global\
    \ load. That made the positions load stall ahead of the data load, fully exposing\
    \ the data load's global-memory latency (ATT: s_waitcnt vmcnt ~14568).\nReorder\
    \ so each K/Q branch issues its q/kv buffer_load FIRST, then computes the RoPE\
    \ pointers (compute_rope_ptrs lambda). The data-load latency now overlaps the\
    \ positions load + address setup (ATT vmcnt stall 14568 -> ~7800).\nPure reordering:\
    \ numerically identical (err_q/k/kpe = 0), dynamic strides and output layout unchanged,\
    \ fully inlined (341 vs 343 exec instrs, 0 extra calls).\nMotivation\n\nTechnical\
    \ Details\n\nTest Plan\n\nTest Result\n\nSubmission Checklist\n\n Look over the\
    \ contributing guidelines at https://github.com/ROCm/ROCm/blob/develop/CONTRIBUTING.md#pull-requests."
