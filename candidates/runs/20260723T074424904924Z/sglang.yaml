  pr: 31962
  title: '[sglang-miles] Fix flush_cache() no-op after pause_generation in retract'
  author: Zhichenzzz
  merged_at: '2026-07-23T03:33:43Z'
  merge_sha: 94949da735cc04bf20b542d18bafff06d3f1b49f
  source_url: https://github.com/sgl-project/sglang/pull/31962
  source_fingerprint: sha256:507cb5db91234687e7ead3423dbaf3b4cf821e54e8ced646dbd715fbc1b3d621
  decision: exclude
  relevance_reason: ROCm marker required but absent
  architectures: []
  architecture_status: unknown
  scope_status: quarantine
  changed_paths:
  - python/sglang/srt/managers/scheduler.py
  - python/sglang/srt/managers/scheduler_components/weight_updater.py
  - test/registered/unit/managers/test_scheduler_flush_cache_after_retract.py
  changed_path_count: 3
  trust: ecosystem
  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Summary

    is_fully_idle() requires an empty waiting_queue, but pause_generation(mode="retract")

    re-queues every retracted request into waiting_queue via _add_request_to_queue.
    So calling

    flush_cache() right after a retract-mode pause always returned success=False and
    skipped the

    actual tree_cache/pool reset. One internal caller, weight_updater.py''s

    flush_cache_after_weight_update, asserts on that return value and crashes the
    whole scheduler

    process outright when it hits this (confirmed live -- see below).

    Retracted requests already released their KV (release_req -> release_kv_cache(is_insert=False),

    tagged via req.is_retracted = True, cleared on re-admission) and hold no pool/tree_cache
    state,

    so they were never a real reason to block a flush -- the waiting_queue check just
    wasn''t written

    to distinguish them from a genuinely new, still-pending request.

    An is_retracted-only exemption turned out to be insufficient under production
    load: with high

    concurrency (in-flight target > engine parallelism) the waiting_queue always also
    holds

    requests that were never scheduled at all. Those carry is_retracted=False yet
    hold no

    KV/pool state either -- by definition they never prefilled, and chunk'
  hardware_features:
  - lds
  kernel_types: []
  discovered_at: '2026-07-23T07:44:25Z'
  captured_at: '2026-07-23'
