  injection_signals: []
  untrusted_excerpt: "Motivation\n\nOn CPU with AMX, the Mamba state pool can be non-contiguous\
    \ (paged layout), which triggered needs_state_gather. This gathered each request's\
    \ state into a contiguous scratch buffer, ran the prefill kernels, then scattered\
    \ the result back via aten::index_put_ — adding significant overhead on every\
    \ prefill step.\nThe gather/scatter workaround is only needed for CUDA prefill\
    \ kernels (causal_conv1d_fwd, chunk_gated_delta_rule), which write state back\
    \ in-place assuming contiguous slot layout and silently mis-write when the pool\
    \ is strided. The CPU counterparts (causal_conv1d_fwd_cpu, chunk_gated_delta_rule_cpu)\
    \ use standard indexed C++ operations and correctly scatter state through cache_indices\
    \ regardless of memory layout.\nModifications\nFix: Add not is_cpu() to the needs_state_gather\
    \ condition so CPU passes the original tensors directly to the kernels, skipping\
    \ the redundant gather/scatter round-trip.\n\nAccuracy Tests\n\nSpeed Tests and\
    \ Profiling\n\nChecklist\n\n Format your code according to the Format code with\
    \ pre-commit.\n Add unit tests according to the Run and add unit tests.\n Update\
    \ documentation according to Write documentations.\n Provide accuracy and speed\
    \ benchmark results "
