  untrusted_excerpt: 'retract_decode disabled the retraction-order policy under speculative
    decoding, citing "filter_batch can only filter requests from the back" — so spec
    runs retract in arrival order instead of the configured retraction_policy (default:
    shortest-output first, which minimizes wasted rework)

    The constraint is stale: the scheduler-side filter_batch calls spec_info.filter_batch(...,
    has_been_filtered=False), and every implementation (eagle_info, dflash_info_v2,
    ngram_info, including the overlap future_indices path) gathers with the arbitrary
    new_indices tensor on that path. The truncation-only branch (has_been_filtered=True)
    has no remaining callers at all — the verify-side pre-filtering it served left
    with the spec v1 paths (#27977); the scheduler is the only caller today and always
    passes False

    Ordering only changes which requests get retracted — each individual retraction
    is the same already-supported operation, and non-spec retraction has been shipping
    policy-sorted (non-ascending) keep sets through the same gathers

    Removes the dead family outright: the has_been_filtered parameter (all three spec_info
    implementations + the scheduler call site), the truncation branch, and the SGLANG_S'
