  untrusted_excerpt: 'Summary

    Post-migration review follow-up on python/sglang/kernels/ — tightens classification
    and naming consistency. Almost entirely git mv renames + import rewrites.

    Changes


    Unify JIT-op naming — drop the leftover _jit_ prefix (a batch-1 shim-era artifact)
    from 8 modules so JIT-backed ops read consistently with the rest (flash_attention.py,
    rope.py, …): activation/activation, layernorm/norm, gemm/dsv3_{fused_a,router}_gemm,
    kvcache/set_mla_kv_buffer, quantization/per_{tensor_quant_fp8,token_group_quant,token_group_quant_8bit_v2}.

    Delete the empty spatial group — it was declared in _GROUPS with zero operators.

    Remove the model group — redistribute the inkling kernels by function: communication
    (all_reduce, ar_fused, ar_scattered_sconv), attention (attn_prologue, rel_proj,
    row_scale), moe (gate_topk_renorm).

    Add an elementwise group for cross-cutting pointwise kernels — move attention/add_constant.py
    (the generic JIT reference kernel the dev guide walks through; no production caller)
    and the mixed fused-pointwise collection layernorm/elementwise.py (softcap / sigmoid-mul
    / gated-activation / fused-rmsnorm shared across grok/qwen) into it. The two fused-rmsnorm
    variants stay layernor'
