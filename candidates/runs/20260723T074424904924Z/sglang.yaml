  title: '[Bugfix] [NPU] Fix w4a8 MoE performance degradation'
  author: OrangeRedeng
  merged_at: '2026-07-23T02:31:32Z'
  merge_sha: 108182cb8199190a66f14c04ff8f0cc669ea7af2
  source_url: https://github.com/sgl-project/sglang/pull/32113
  source_fingerprint: sha256:1d85e0e89f699c16615e2cf5921e033fc82da2558d8ae3ef52535ae90433321e
  decision: exclude
  relevance_reason: ROCm marker required but absent
  architectures: []
  architecture_status: unknown
  scope_status: quarantine
  changed_paths:
  - python/sglang/srt/hardware_backend/npu/quantization/moe_methods.py
  changed_path_count: 1
  trust: ecosystem
  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Motivation

    The NPU MoE refactor #25663 changed the W4A8 weight-layout conversion order. The
    transposed weight was passed to npu_format_cast without first materializing a
    contiguous tensor, and packing made the tensor contiguous before reinterpreting
    it as int32.

    For Qwen3.5-397B-A17B W4A8 with DeepEP, this increased mean TPOT from 52.53 ms
    on the known-good commit (c9b17403e7c2409ac9603a582685b098a399926d) to 63.64 ms
    on main.

