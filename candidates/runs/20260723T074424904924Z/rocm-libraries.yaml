  untrusted_excerpt: 'Summary

    MaxWavesPerSimd in rocisa''s hardware_caps.hpp was hardcoded to 10 — the

    GCN/CDNA SIMD16 wave-slot count — for every architecture that is not

    ArchAccUnifiedRegs. That default wrongly applied to gfx11/gfx12 gaming parts,

    which use SIMD32 with a deeper wave buffer of 16 slots.




    Family

    Arch

    Wave slots / SIMD





    CDNA unified-regs

    gfx90a / gfx942 / gfx950

    8



    GCN/CDNA (SIMD16)

    gfx906 / gfx908, gfx1250 (isa 12.5.x)

    10



    gfx11 / gfx12 gaming

    gfx1100 / gfx1151 / gfx1200 / gfx1201

    16




    This cap feeds getVgprOccupancy() in KernelWriterAssembly; understating it

    (10 instead of 16 on gfx11/gfx12) lowered the reported occupancy ceiling for

    low-VGPR kernels.

    Reference: AMD GPUOpen, "Occupancy explained"

    — 16 wave slots per SIMD32 on gfx11.

    Changes


    Return 16 for gfx11 and gfx12 gaming parts (gfx1200/gfx1201). gfx1250

    (12,5,0) is CDNA-class and is explicitly excluded so it stays at 10.

    Extend test_max_waves_per_simd_from_arch_caps with gfx1100 / gfx1151 /

    gfx1200 / gfx1201 (16) and a gfx1250 (10) regression guard.


    Scope note

    This PR corrects the wave-slot cap only. getVgprOccupancy() also uses

    MaxVgpr = 256 (a gfx9 wave64 value) as the per-SIMD VGPR-file budget, so

    realistic gfx11/gfx1'
