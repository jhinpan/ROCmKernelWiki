  untrusted_excerpt: "Close #9691\nSummary\n\nSplits the CDNA5 scheduler's forced-barrier\
    \ phase into a pure decision (decidePromote()) and a per-phase gate (isPromote(phase)).\n\
    decidePromote() runs once at the top of pickOne() and records which phase must\
    \ fire this pick, mutating no queue. Each normal phase guards its body with isPromote(ThisPhase):\
    \ true when nothing is promoted (every phase runs exactly as before) or when it\
    \ is the promoted phase (only it runs).\nThe promoted node issues through its\
    \ own existing phase, so a forced barrier no longer needs a dedicated phase ahead\
    \ of WMMA — removing the second barrier entry point.\n\nWhy\nThis is the extension\
    \ point for future \"must issue now\" rules (e.g. hoisting a cheap SGPR setup\
    \ that unblocks a pending tensor_load). A new forcing rule becomes a new case\
    \ in decidePromote(), not a new phase — avoiding per-rule phase multiplication\
    \ and duplicate entry points.\nTest plan\n\n ctest full suite: 946/946\n Byte-identical:\
    \ tensilelite stinky_sia4.yaml gfx1250 reference kernels, 0/600 differ (instruction\
    \ order, label-normalized) vs develop"
