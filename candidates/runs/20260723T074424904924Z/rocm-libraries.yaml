  untrusted_excerpt: 'Should be merged after #6695

    Relevant commit: 7395870

    This PR extends the sparse triangular solve (spsm amd sptrsm) to support matrices
    in CSC format, in addition to the existing CSR and COO formats.


    Implementation approach:



    CSC support is implemented by leveraging the existing CSR path via a transpose
    mapping. This avoids code duplication and reuses the well-tested CSR triangular
    solve kernel. When a CSC matrix is passed:

    The operation is remapped: none → transpose, transpose → none, conjugate_transpose
    → conjugate

    The fill mode is flipped accordingly (lower ↔ upper)

    A temporary CSR descriptor is built by swapping row/col pointers and metadata


    JIRA ID: AISPARSE-557'
