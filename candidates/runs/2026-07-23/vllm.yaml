  untrusted_excerpt: 'The bug

    VLLM_XLA_CACHE_PATH (derived from XDG_CACHE_HOME) and VLLM_CONFIG_ROOT (derived
    from XDG_CONFIG_HOME/HOME) are hashed into the torch.compile cache key (envs.compile_factors()
    → backends.py hash_key and caching.py aot_compile_hash_factors). Where a cache
    or config directory lives carries no information about compiled artifacts, but
    because these derived paths are hashed, relocating HOME or the XDG roots silently
    invalidates every compile cache. On a CUDA machine the invalidation is triggered
    by an XLA cache path CUDA never uses.

    This defeats copying or pre-baking a compile cache into a container image (the
    cache misses whenever the container''s HOME/XDG layout differs from the bake environment),
    which is the standard fast-cold-start pattern.

    Measured

    H100, vLLM 0.24.0, Qwen3-8B: restoring a compile cache onto an identical stack
    (same wheel, model, GPU model, driver) under a different HOME/XDG layout produced
    a different hash dir (b3b24f9e91 → b3502dab6c), missed both the per-compile cache
    and the AOT cache (Directly load never fired), and re-ran the full 18.4s compile
    alongside the restored artifacts. No warning, just a slower boot and a doubled
    cache. The recorded cache_key_'
