  untrusted_excerpt: 'Summary


    label PRs that touch the core quantization directory or contain quant in the title

    label issues containing the whole words quantization or quantized


    Why

    The existing quantization label had no automatic PR or issue application, so relevant
    work was under-labeled. Searches for open PRs about quantization label and issue-autolabel
    automation found no duplicate change.

    Impact

    Quantization-related PRs and issues will be routed to the existing label with
    conservative matching.

    Testing


    git diff --check

    YAML parsing with PyYAML

    .venv/bin/pre-commit run --files .github/mergify.yml .github/workflows/issue_autolabel.yml


