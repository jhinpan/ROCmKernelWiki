  untrusted_excerpt: 'Context

    When DeepSeek V4 uses MXFP4 indexer K values, engine reserves the larger FP8 row
    for them. Its packed KV planner also buckets layers by page size, leaving avoidable
    holes when different cache groups have different mixtures of page sizes.

    This PR:


    sizes MXFP4 indexer K rows from their packed values and UE8M0 scales (head_dim
    / 2 + head_dim / 32 bytes), reducing the 128-dimensional row from 132 to 68 bytes;

    lays out every packed cache group densely in one per-block slab and overlays the
    group layouts, while keeping layers within each group disjoint; and

    removes cross-group SWA page padding that the dense planner no longer needs.


    The packing change is generic to the existing packed-cache path. DeepSeek V4 uses
    that path by default; other hybrid models retain the existing opt-in via enable_cross_layers_blocks.

