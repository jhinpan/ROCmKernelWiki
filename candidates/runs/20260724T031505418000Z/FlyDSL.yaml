  untrusted_excerpt: 'Summary

    Keep broad FlyDSL test runs deterministic:


    scripts/run_tests.sh explicitly sets FLYDSL_AUTOTUNE=0 before pytest and standalone
    examples.

    The GPU-free default/cache-path test exercises that explicit off value and fails
    if benchmarking is reached.

    Dedicated autotune tests remain responsible for setting FLYDSL_AUTOTUNE=1 around
    the forced-search cases they own.


    The shared runner is used by both the source and wheel CI workflows, so this is
    one guard rather than duplicated workflow configuration.

    Why this is the right CI boundary

    Autotune search is timing-sensitive and expensive. Shared CI should verify deterministic
    control-flow and correctness contracts, not select or commit a performance winner
    from noisy runner timing.

    The current offline-artifact work in #786 already owns artifact identity, validation,
    fallback, and emit/load tests. Its artifacts are content-addressed deployment
    inputs generated on the intended GPU; FlyDSL currently has no committed artifact
    tree. The previous configs/autotune/ registry and standalone committed-config
    validator were therefore both stale and unnecessary.

    This PR adds no job, runner, config registry, or autotuner API.

    Verification


    python3'
