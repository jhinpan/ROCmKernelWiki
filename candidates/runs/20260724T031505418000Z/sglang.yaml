  injection_signals: []
  untrusted_excerpt: 'Motivation


    In DeepSeek-V4''s NSA prefill context parallel mode, the attention linears (wo_a,
    wo_b, wq_b) are initialized with tp_size=1 and weights are repeated across all
    CP ranks. For CP8, this means 8× redundant attention linear computation during
    decode.

    By slicing the repeated weights to only the local TP partition (matching what
    normal TP8 would compute), we can eliminate this redundancy and reduce decode
    latency.

    Modifications




    New CpDecodeAttnTpContext (layers/utils/cp_decode_attn_tp.py): Context manager
    that partitions attention weights to local TP rank during decode. On each forward,
    detects whether the batch is prefill (all heads needed) or decode (only local
    partition needed). For decode, replaces weight.data and quant scales with sliced
    views; restores originals after the GEMM. Slices are lazily computed and cached
    on first activation.



    Modified MQALayer (models/deepseek_v4.py): Adds CpDecodeAttnTpContext instance.
    Wraps attention forward with maybe_use_decode_attn_tp(), which activates partitioning
    for wq_b, wo_a, wo_b during decode. Properties n_local_heads, n_local_groups,
    tp_rank, tp_size dynamically return partitioned or original values.



    Modified RowParallelL'
