    Bug 1: use-after-free on the activation scale (the "host memory" crash)

    In sgl-deep-gemm (<= 0.1.4.post1), get_mn_major_tma_aligned_tensor crosses TVM-FFI
    via a non-owning torch::from_blob view (csrc/utils/torch_compat.hpp), and the
    already-aligned fast path (smxx_layout.hpp) returns that alias directly. The caller
