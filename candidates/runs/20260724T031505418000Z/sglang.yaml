  title: '[core/loader] Fix presharded cache-key gaps: moe_dense_tp_size, EPLB with
    structural signature'
  author: shuwang21
  merged_at: '2026-07-23T22:07:05Z'
  merge_sha: 11c9702d90f59060fca3324369fe2a270271a62f
  source_url: https://github.com/sgl-project/sglang/pull/29830
  source_fingerprint: sha256:af48977a2807eb7909045f540a1b9852e42890af8c5234f5d80ce962a1c42c1c
  decision: exclude
