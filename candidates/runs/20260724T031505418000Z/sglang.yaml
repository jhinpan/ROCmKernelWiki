  title: '[Fix] Reserve the mamba pool''s +1 padding slot in the memory budget solve'
  author: hnyls2002
  merged_at: '2026-07-23T21:55:36Z'
  merge_sha: 59ef3b15cc86eb64c48cd5e687a95dbefb872a29
  source_url: https://github.com/sgl-project/sglang/pull/32184
  source_fingerprint: sha256:e7cecb08bd6e3b161fd75a70837d436cac4039bc0ede06b53c36c6f2db6fff67
  decision: exclude
  relevance_reason: ROCm marker required but absent
  architectures: []
  architecture_status: unknown
  scope_status: quarantine
  changed_paths:
  - python/sglang/srt/mem_cache/kv_cache_configurator.py
  changed_path_count: 1
  trust: ecosystem
  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Summary


    The mamba/hybrid budget solve in _handle_max_mamba_cache reserves only the per-request
    state slots, but the pool physically allocates every per-slot buffer with one
    extra padding slot (index 0, the sink for cuda-graph padded batches — the ReqToTokenPool
    base convention in memory_pool.py): main conv/ssm allocate K + 1 slots, and the
    spec intermediate buffers allocate (spec_state_size + 1) x D rows

    The unreserved padding slots ((1 + D) * per_req, ~0.5 GB at fp32 ssm with D=8)
    silently came out of the profiled slack; reserve them exactly in all three arms


    The calculation, before vs after

    What the pool actually allocates per GPU: main state (K + 1) * per_req; with spec,
    intermediates (max_running + 1) * D * per_req, where K = max_mamba_cache_size,
    max_running = K // S, and S = state slots per running request from _calculate_mamba_ratio().

    Before (ratio-based auto arm, spec):

    K        = budget // (per_req * (1 + D/S))

