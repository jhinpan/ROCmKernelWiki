    down_input_scale = deep_gemm_wrapper.get_mn_major_tma_aligned_tensor(down_input_scale)

    so the storage is freed to the caching allocator and reused before the down GEMM
    (enqueued later) reads the scales. #30924 triggered it because the unified kernel
    emits scales '
