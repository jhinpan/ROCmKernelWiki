  untrusted_excerpt: 'Summary

    The FlashAttention and XPU attention backends resolved kv_cache_dtype_str from
    the

    process-global published model config (get_model().kv_cache_dtype). That global

    reflects only the target runner: a draft (speculative) worker configures its own
    kv cache

    dtype but does not publish it, so a draft backend would inherit the target''s
    dtype string

    and mis-select its fp8 code paths whenever the draft''s kv cache dtype differs
    from the

    target''s.

    Read the dtype string straight from model_runner.kv_cache_dtype_str instead, which
    is

    set per runner during kv-cache configuration before any attention backend is initialized,

    so each backend — target or draft — uses its own resolved dtype.

    Also drop the getattr(..., server_args.kv_cache_dtype) fallback in the lightning
    and

    dual-chunk backends: kv_cache_dtype_str is always set on a real runner before
    backend

    init, so the fallback only masked setup bugs.

    Test


    test/manual/attention/test_flashattn_backend.py mock updated to set the attribute

    directly; the non-CP tests pass.


    🤖 Generated with Claude Code



