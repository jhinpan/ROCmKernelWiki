  architectures: []
  architecture_status: unknown
  scope_status: quarantine
  changed_paths:
  - python/sglang/srt/model_loader/loader.py
  - test/registered/unit/model_loader/test_presharded_loader.py
  changed_path_count: 2
  trust: ecosystem
  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Motivation

    PreshardedModelLoader caches per-rank weight shards under a subfolder derived
    from the sharding config. If two launches with different configs map to the same
    subfolder, the loader silently serves wrong weights.

    Two concrete gaps in the existing cache key:


    moe_dense_tp_size: controls dense-layer TP width independently of global tp_size.
    A run with --moe-dense-tp-size 1 and a default run both produced TP-4, colliding
    on the same directory.

    EPLB settings (ep_num_redundant_experts, init_expert_location): change which logical
    expert''s weights land in each physical slot without changing tensor shapes, so
    they must be explicit key fields.


    More broadly, every new sharding dimension requires a manual update to the key-building
    code — easy to forget, and the subfolder name grows with each addition. This PR
    restructures the key as TP-{tp}-sig-{hash16} and adds a structural signature as
    a self-correcting safety net.

    Modifications

    loader.py — _collect_shard_config (new) + _build_subfolder_name (restructured)

    All key dimensions (TP/DP/EP/PP, moe_dense_tp_size, quantization, model dtype,
    EPLB fields, structural signature) are collected into a JSON-native dict and folded
    into one SHA'
