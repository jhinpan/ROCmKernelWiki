  changed_path_count: 4
  trust: ecosystem
  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Motivation

    Hybrid Mamba models cache Mamba states at radix-tree checkpoints. On long shared-prefix
    workloads, an unbounded number of checkpoints along one path can exhaust the fixed
    Mamba state pool and cause cache churn, even when the corresponding Full KV remains
    reusable.

    This PR adds an opt-in per-path Mamba state budget. The default is -1 (unlimited),
    so existing behavior is unchanged. 0 and values below -1 are rejected to avoid
    conflating an unlimited budget with a zero-state budget.

    Modifications


    Add --mamba-max-states-per-path: -1 means unlimited, while positive integers enable
    the cap.

    After inserting a Mamba state, prune the shallowest eligible interior device checkpoints
    when the path exceeds the configured cap.

    Preserve the tail, fork nodes, locked nodes, device leaves, Full KV, and any existing
    host backup. The cap is therefore a best-effort soft limit.

    Reuse the existing UnifiedRadixCache eviction, allocator, LRU, and accounting
    paths.

    Add CPU unit coverage for the default, CLI parsing, invalid-value rejection, shallow
    pruning and accounting, Full KV retention, protected nodes, existing HiCache host-backup
    preservation, and the unlimited path.


    Accuracy Tests

    Validat'
