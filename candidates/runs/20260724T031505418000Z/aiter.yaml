  untrusted_excerpt: 'get_meta_param gains an ignore_total_kv flag (default 0 = legacy).
    When set, the auto split-count search uses only the CU-occupancy factor (drops
    the avg_kv HBM-efficiency term) and skips the fp8 min-block cap, giving a pure
    occupancy-driven pick independent of per-seq KV length.

    mla_decode_fwd_v4_nm forces this on internally so v4 nm decode selects splits
    purely by CU occupancy. Because this can pick num_kv_splits > 1 even for short
    KV (where the fp8 cap previously forced single-pass), test_v4_nm_sink now compares
    the authoritative BF16 output buffer (populated for both single- and multi-pass)
    instead of the single-pass-only packed-BF16 logits view.'
