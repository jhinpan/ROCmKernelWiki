  untrusted_excerpt: 'Problem

    Starting gpt-oss-120b with -tp 2 --enable-dp-attention --enable-expert-parallel
    --enable-tbo crashes during CUDA/HIP graph capture:

    Hip error: ''operation not permitted when stream is capturing''(900) at hipblaslt.cpp:147

    Engine Core: load model runner failed


    Root cause

    Several gpt-oss bf16 GEMM shapes have no tuned config, so they fall back to the
    torch path (F.linear → hipBLASLt). Under --enable-tbo, decode batches are split
    into bs/2 micro-batches, producing GEMM shapes (e.g. m=2880 n=128 k=4096, the
    o/down projection at the TBO ubatch token count) that are executed for the first
    time during cudagraph capture. hipBLASLt''s algorithm/workspace init on first
    touch of a shape is stream-capture-illegal → HIP error 900.

    Confirmed via HIPBLASLT_LOG_MASK=32 trace: the crashing matmul carries a hipBLASLt
    solution_index, i.e. it went through the hipBLASLt path.

    Fix

    Tune the affected gpt-oss bf16 GEMM shapes (all dtype=bf16 outdtype=bf16) so they
    resolve to direct-launch kernels instead of torch/hipBLASLt:




    N

    K

    role





    2880

    4096

    o / down proj



    5120

    2880

    qkv / gate-up



    128

    2880

    router gate



    201088

    2880

    lm_head




    Result: all resolve to asm / flydsl / triton / opus — no torch/hi'
