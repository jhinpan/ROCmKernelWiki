  injection_signals: []
  untrusted_excerpt: 'Summary of proposed changes


    Fix a GPU memory access fault when building a Smoothed-Aggregation AMG (SAAMG)
    preconditioner on wave32 hardware (RDNA/RDNA3, e.g. gfx1100).

    Dispatch the smoothed-aggregation prolongation kernels with a WFSIZE that matches
    the physical wavefront on wave32 devices.

    Extend the existing SAAMG test so the failing configuration is actually exercised.


    Root cause

    The smoothed-aggregation prolongation is built by kernel_csr_sa_prolong_nnz and
    kernel_csr_sa_prolong_fill (src/base/hip/hip_matrix_csr.cpp, in AMGSmoothedAggregationProlongNnz
    / AMGSmoothedAggregationProlongFill). The dispatch selects a compile-time WFSIZE
    template argument from the maximum non-zeros per row of the operator, and dense
    operators (>= 128 nnz/row) select the WFSIZE = 64 (wave64) kernels.

    These kernels assume WFSIZE equals the physical wavefront size: they keep one
    shared-memory hash table per logical wavefront and use cross-lane wavefront reductions/shuffles.
    On wave32 hardware a logical 64-lane wavefront spans two physical 32-lane wavefronts,
    so neighbouring logical wavefronts overlap in LDS (corrupting the hash tables)
    and the reductions read non-existent lanes. This yields a malform'
