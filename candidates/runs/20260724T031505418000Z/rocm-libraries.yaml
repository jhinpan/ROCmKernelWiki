  untrusted_excerpt: 'Motivation

    The rocke package (dnn-providers/hip-kernel-provider/rocke/platform/) had no

    written coding standards or contribution policy of its own — it inherited only
    the

    monorepo-wide formatters. This PR establishes three reference documents so new
    code

    (and AI-assisted contributions) stay consistent and compliant:


    A non-negotiable Compliance policy in AGENTS.md that binds every agent and

    contributor (AMD export controls, restricted-data handling, no NPI, device-names-only,

    no public performance data, no legal/marketing claims, no internal links).

    Python and C++ style guides derived from the existing rocke code, so new code
    is

