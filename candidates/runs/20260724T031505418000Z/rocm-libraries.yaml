  untrusted_excerpt: "ISSUE ID: AIHPBLAS-4126\nMotivation\nOn gfx1250 FFM, get error\
    \ wave dbg_id:0x300 signaled barrier (-3) that is already completed.\nTechnical\
    \ Details\nPreviously s_barrier_wait -3 was appended at the end of the loop section\n\
    module. Early-exit branches (SkipToNLL, SkipToNGLL, SkipTailLoopL) could\njump\
    \ past the deferred wait, leaving the barrier signalled but never\nwaited, which\
    \ trips FFM assertions and is incorrect on hardware.\nAdd a second pass that places\
    \ the wait before the first early-exit\nbranch (SCBranchSCC1) that follows each\
    \ signal. This guarantees no exit\npath can skip the wait while preserving a latency-hiding\
    \ gap (typically\n8+ WMMAs) between signal and wait. If no exit branch follows\
    \ a signal,\nthe wait is appended at the module end as before.\nTest Result\n\n\
    Cluster yaml now passes on FFM with no error\n Run on gfx1250\n\nAsm changes\n\
    1) Move preloop wait to be before the branch\n\n2) Adjust tail loop wait location"
