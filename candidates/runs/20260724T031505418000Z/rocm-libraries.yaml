  untrusted_excerpt: "Close #9696\nStacked on top of #9692 (base branch is that PR's\
    \ branch). Review/merge #9692 first.\nSummary\nModels the CDNA5 hardware hazard\
    \ requiring a fixed gap between a SALU writing an SGPR and a tensor_load reading\
    \ that SGPR as a source (a producer->consumer edge hazard, not either op's own\
    \ issue/latency cycles).\n\nPre-scan records the exact hazard register keys (regDepKey,\
    \ so register type is encoded and this extends to other producer->consumer hazards)\
    \ on the producing node, via the def-use user walk.\nConsumer-side gate: when\
    \ a flagged producer issues, its hazard keys are stamped into a dedicated map\
    \ (separate from regDataReadyCounters so only the tensor_load pick consults it\
    \ — a VALU/SALU reading the same SGPR is not gated). The tensor_load pick waits\
    \ out the remaining hazard.\nProducer-side hoist: a flagged producer outranks\
    \ ds/valu of the same non-WMMA tier, so it drifts earlier and intervening work\
    \ absorbs the gap; when it cannot be fully absorbed, the gate delays the tensor_load.\n\
