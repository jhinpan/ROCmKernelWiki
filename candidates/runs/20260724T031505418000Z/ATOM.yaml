  untrusted_excerpt: 'Motivation

    This PR implements IntraGPU disaggregation (RAPID-Serve: https://arxiv.org/abs/2601.11822).
    The main idea is to run prefill and decode on the same GPU(s) concurrently on
    separate streams to maximize GPU utilization and throughput while improving latencies.
    This techniques avoids the TPOT overheads associated with chunked prefill and
    also avoids KV cache transfers required for Inter-GPU/node disaggregation.

    Technical Details

    Major changes include:


    "enable-disagg" parameter to enable Intra-GPU disaggregation

    Separate prefill and decode processes, engines and schedulers

    Model weights and KV cache tensors are shared through IPC

    Only decode manages the KV cache blocks to avoid inter-process syncs and locks

    A new request is routed to both prefill and decode. The decode assigns the KV
    cache blocks based on the prefill length and notifies the prefill process. The
    prefill process then processes the prompt, populates the KV cache and notifies
    decode. The decode process then adds the new decode to the running batch.

    Two supported modes: unconstrained and constrained. In Unconstrained mode, both
    prefill and decode run on separate streams and the workgroup scheduling is done
    by the '
