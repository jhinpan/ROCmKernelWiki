  injection_signals: []
  untrusted_excerpt: 'Purpose

    Fix XPU crashes in test_gpt_oss_lora_tp2 and test_gpt_oss_lora when mxfp4_use_marlin=True
    due to an unsupported MXFP4 Marlin backend.

    Root cause

    The tests explicitly request moe_backend="marlin" and linear_backend="marlin",
    but Marlin MXFP4 kernels are CUDA‑only and not registered for XPU. Explicit requests
    fail instead of falling back, unlike the auto path which correctly skips Marlin
    on XPU.

    Fix

    The ROCm skipif already exists for this reason; this PR adds the equivalent XPU
    condition to skip the tests as well.'
