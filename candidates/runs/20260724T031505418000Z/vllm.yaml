  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: 'Purpose


    Fix HYV3 model with CT inference


    Testing


    Validated that RedHatAI/Hy3-NVFP4-FP8 runs


    RCA


    LinearBase.__init__ sets self.has_bias = bias, and some custom model layers (e.g.
    Hy3-NVFP4-FP8) pass bias=None. This None propagates as has_bias=None into HummingLayerMeta.

    BaseHummingConfig.to_cpp_str() skips any field whose value fails isinstance(value,
    (bool, int, Enum)) — None fails this check, so kHasBias is omitted from the generated
    C++ struct.

    NVRTC then fails with: class "LayerConfig" has no member "kHasBias".'
