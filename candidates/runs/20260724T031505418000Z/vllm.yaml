  license: Apache-2.0
  injection_signals: []
  untrusted_excerpt: "Purpose\nServing a sparse-MLA target such as nvidia/GLM-5.2-NVFP4\
    \ with a regular sliding-window DSpark draft could fail during KV-cache planning\
    \ because the target MLA/indexer pages cannot be unified with the draft page.\n\
    Design\nKeep the existing grouping path unchanged when page sizes can be unified.\
    \ If page-size unification fails for the narrow MLA + regular-SWA case, promote\
    \ only the draft's cache-allocation spec to FullAttentionSpec and reconcile it\
    \ to the target's unique block size (64 for GLM). Draft attention computation\
    \ remains sliding-window.\nThis produces one UniformTypeKVCacheSpecs group with\
    \ a shared block table and the existing contiguous per-layer tensors. It avoids\
    \ adding a new allocator layout or changing packing, zeroing, or memory accounting.\
    \ Existing page padding is enlarged when necessary after block-size promotion.\n\
    The tradeoff is deliberate: the single draft layer allocates KV slots like full\
    \ attention, so this does not retain SWA's physical-memory saving. With today's\
    \ global block pool, however, it avoids the additive block-ID demand of separate\
    \ target and draft groups.\nValidation\n.venv/bin/python -m pytest tests/v1/core/test_kv_cache_utils.py\
    \ \\\n  tests/v1/core"
