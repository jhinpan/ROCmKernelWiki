  untrusted_excerpt: 'Purpose

    For a long-context request, 289K tokens is about 2,258 blocks. ChunkedTokenDatabase.prepare_value
    spends about 35 ms of GIL-held time per request computing RDMA target addresses
    on the KV load path.

    This cost is amplified by the receive-thread pool in #45971: four concurrent key
    builds take 208 ms wall time, compared with 174 ms when run serially.

    This PR vectorizes the computation with NumPy and keeps prepare_value as a single-chunk
    wrapper around the batch implementation. Measured time for the 2,258-block shape
    improves from 34.2 ms to 7.7 ms (about 4.4×). Following review feedback, the store/send
    path also batches address preparation once per KV-cache group.

    Non-duplication

    Open-PR searches for Mooncake prepare_value and ChunkedTokenDatabase prepare_values
    found no overlapping work other than this PR.

