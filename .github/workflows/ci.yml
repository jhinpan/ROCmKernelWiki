name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Validate frontmatter, vocabulary, links, version-claims
        run: python3 scripts/validate.py

      - name: Smoke-test query tooling
        run: python3 tests/test_validate.py

      - name: Guide retrieval and architecture safety
        run: python3 tests/test_retrieval.py

      - name: Scored multi-source retrieval evaluation
        run: python3 scripts/evaluate_skill.py --output /tmp/retrieval-eval.json --check

      - name: Answer facts and citations
        run: |
          python3 scripts/evaluate_answers.py \
            --answers data/evals/reference-answers.jsonl \
            --output /tmp/answer-eval.json \
            --check

      - name: Evolution pipeline contracts
        run: python3 tests/test_evolution.py

      - name: Verify stored artifact provenance
        run: python3 scripts/verify_provenance.py

      - name: Corpus manifest is current
        run: python3 scripts/evolve/corpus.py --check

      - name: Indices are up to date
        run: |
          python3 scripts/generate-indices.py
          if ! git diff --quiet -- queries/; then
            echo "::error::queries/ is stale — run scripts/generate-indices.py and commit"
            git --no-pager diff --stat -- queries/
            exit 1
          fi

  examples-build:
    # Public PR code never executes on the MI355 node. This hosted job checks the
    # build/run boundary and shell syntax only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every example has a reviewable build-only path
        run: |
          missing=0
          for d in examples/*/; do
            [ "$(basename "$d")" = "README.md" ] && continue
            [ -d "$d" ] || continue
            if [ ! -f "$d/build.sh" ]; then echo "::error::$d missing build.sh"; missing=1; fi
            if [ ! -f "$d/README.md" ]; then echo "::error::$d missing README.md"; missing=1; fi
            bash -n "$d/build.sh" || missing=1
            script_body="$(<"$d/build.sh")"
            if [[ "$script_body" != *"source ../_common.sh"* ]]; then
              echo "::error::$d build.sh bypasses the shared build/run boundary"
              missing=1
            fi
            while IFS= read -r line; do
              if [[ "$line" =~ ^[[:space:]]*\./ ]]; then
                echo "::error::$d directly executes a built binary: $line"
                missing=1
              fi
            done < "$d/build.sh"
          done
          exit $missing
