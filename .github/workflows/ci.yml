name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Validate frontmatter, vocabulary, links, version-claims
        run: python3 scripts/validate.py

      - name: Smoke-test query tooling
        run: python3 tests/test_validate.py

      - name: Indices are up to date
        run: |
          python3 scripts/generate-indices.py
          if ! git diff --quiet -- queries/; then
            echo "::error::queries/ is stale — run scripts/generate-indices.py and commit"
            git --no-pager diff --stat -- queries/
            exit 1
          fi

  examples-build:
    # Examples need hipcc; GitHub-hosted runners have no ROCm. This job documents
    # the gate and stays green by checking that every example ships a build.sh.
    # On a self-hosted ROCm runner, replace the check with: bash build.sh per dir.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every example has a build.sh + README
        run: |
          missing=0
          for d in examples/*/; do
            [ "$(basename "$d")" = "README.md" ] && continue
            [ -d "$d" ] || continue
            if [ ! -f "$d/build.sh" ]; then echo "::error::$d missing build.sh"; missing=1; fi
            if [ ! -f "$d/README.md" ]; then echo "::error::$d missing README.md"; missing=1; fi
          done
          exit $missing
